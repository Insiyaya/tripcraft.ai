<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripCraft AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <style>
        /* Painted before React mounts, so it cannot read the theme store and has
           to guess. prefers-color-scheme is the closest available signal —
           without it this flashed a dark slate panel ahead of a butter-yellow
           app on every cold load. */
        .init-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf1dc}
        .init-spinner{width:40px;height:40px;border:4px solid #8a5a2b;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
        @media (prefers-color-scheme: dark){
          .init-loader{background:#241a0e}
          .init-spinner{border-color:#e8b75a;border-top-color:transparent}
        }
        @keyframes spin{to{transform:rotate(360deg)}}
      </style>
      <div class="init-loader"><div class="init-spinner"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
